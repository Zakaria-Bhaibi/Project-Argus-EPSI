# %u = username = certificate Common Name (use_identity_as_username).
# A node can only write its own telemetry/events/status and only read its own commands.
pattern write argus/v1/nodes/%u/telemetry
pattern write argus/v1/nodes/%u/events
pattern write argus/v1/nodes/%u/status
pattern read  argus/v1/nodes/%u/cmd

# The API service reads everything and is the only writer of commands.
user argus-api
topic read  argus/v1/nodes/+/telemetry
topic read  argus/v1/nodes/+/events
topic read  argus/v1/nodes/+/status
topic write argus/v1/nodes/+/cmd
topic read  $SYS/broker/#
