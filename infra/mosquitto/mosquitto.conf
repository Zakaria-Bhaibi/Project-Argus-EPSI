# ARGUS broker: MQTT over TLS only, every client must present a cert signed by the ARGUS CA.
per_listener_settings false
allow_anonymous false

# No plaintext listener. 8883 = MQTTS with mutual TLS.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/mosquitto.crt
keyfile /mosquitto/certs/mosquitto.key
crlfile /mosquitto/certs/ca.crl
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# Authorization: identity = certificate CN (see acl.conf)
acl_file /mosquitto/config/acl.conf

# Anti-DoS limits
max_connections 64
max_inflight_messages 20
max_queued_messages 200
max_packet_size 4096
max_keepalive 120

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

log_dest file /mosquitto/log/mosquitto.log
