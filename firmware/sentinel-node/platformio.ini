; ARGUS Sentinel-X node firmware (ESP32). Runs in Wokwi and on a real ESP32 DevKit unchanged.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DMQTT_MAX_PACKET_SIZE=1024
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2
  adafruit/Adafruit SSD1306@^2.5
  adafruit/Adafruit GFX Library@^1.11
  beegee-tokyo/DHT sensor library for ESPx@^1.19
